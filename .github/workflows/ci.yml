name: Awesome-(Ro)Bot

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Install gem
        run: gem install awesome_bot
      - name: Check links
        # -d forces awesome_bot to check links one at a time instead of its
        # default 10 concurrent threads; that concurrent burst against
        # github.com is what was triggering GitHub rate-limit 503s and
        # dropped connections, not actually broken links.
        run: |
          awesome_bot README.md --allow-dupe --allow 429,503 -d 0.5 -t 15 -w robotframework.org,linkedin.com,theseus.fi
      - name: Check awesome-list conventions
        # Informational only: the list intentionally keeps some conventions
        # awesome-lint disagrees with (back-to-top links, repeated domain
        # links across sections), so this doesn't block merges yet.
        continue-on-error: true
        run: npx --yes awesome-lint
